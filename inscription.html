<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formations Digitales</title>

<style>
body { font-family: Arial; margin:0; background:#f5f6fa; }

header {
  background:#2f80ed;
  color:white;
  padding:15px;
  text-align:center;
}

section {
  padding:40px 20px;
  max-width:1000px;
  margin:auto;
}

h2 { text-align:center; color:#2f80ed; }

.formations {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}

.formation {
  background:white;
  padding:20px;
  border-radius:8px;
  width:250px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  text-align:center;
}

button {
  padding:10px;
  background:#27ae60;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

form {
  max-width:400px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

input, textarea {
  padding:10px;
  border-radius:5px;
  border:1px solid #ccc;
}

#status {
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <h1>🚀 Centre de Formation Digitale</h1>
</header>

<!-- FORMATIONS -->
<section id="formations">
  <h2>Choisissez votre formation</h2>
  <div class="formations">

    <div class="formation">
      <h3>IA</h3>
      <p>Créer histoires, chansons et vidéos automatiques</p>
      <button onclick="choisirFormation('IA')">Choisir</button>
    </div>

    <div class="formation">
      <h3>Développement Web</h3>
      <p>Apprendre HTML & CSS facilement</p>
      <button onclick="choisirFormation('WEB')">Choisir</button>
    </div>

    <div class="formation">
      <h3>Marketing Digital</h3>
      <p>Gagner de l’argent en ligne</p>
      <button onclick="choisirFormation('MARKETING')">Choisir</button>
    </div>

  </div>
</section>

<!-- INSCRIPTION -->
<section id="inscription">
  <h2>Inscription</h2>

  <form id="form">

    <input type="text" name="name" placeholder="Nom complet" required>

    <input type="email" name="email" placeholder="Email" required>

    <input type="text" name="country" placeholder="Pays" required>

    <input type="text" name="whatsapp" placeholder="WhatsApp" required>

    <input type="text" id="formation" name="formation" readonly>

    <textarea name="message" placeholder="Message"></textarea>

    <button type="submit">S'inscrire</button>

  </form>

  <p id="status"></p>

</section>

<script>

// choisir formation
function choisirFormation(f){
  document.getElementById("formation").value = f;
  window.scrollTo({
    top: document.getElementById("inscription").offsetTop,
    behavior: "smooth"
  });
}

// envoi formulaire
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  const status = document.getElementById("status");
  status.innerHTML = "⏳ Envoi en cours...";

  fetch("https://formsubmit.co/ajax/gaelnobime5@gmail.com", {
    method: "POST",
    body: new FormData(this)
  })
  .then(res => res.json())
  .then(() => {
    status.style.color = "green";
    status.innerHTML = "✅ Inscription réussie !";

    setTimeout(()=>{
      window.location.href = "merci.html";
    },1500);

    this.reset();
  })
  .catch(()=>{
    status.style.color = "red";
    status.innerHTML = "❌ Erreur, réessaie.";
  });

});

</script>

</body>
</html>
