<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription Formation</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: #0f172a;
    }

    section {
      max-width: 500px;
      margin: auto;
      padding: 30px;
    }

    h3 {
      text-align: center;
      font-size: 22px;
      color: #2f80ed;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 14px;
      color: #0f172a;
      background: #f8fafc;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #2f80ed;
      background: white;
    }

    input[readonly] {
      background: #e2e8f0;
      color: #64748b;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #2f80ed;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1c5fc4;
    }

    button:disabled {
      background: grey;
      cursor: not-allowed;
    }

    .mute-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: red;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    footer {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }
  </style>
</head>

<body onload="demarrerGuide()">

<section>

  <h3>Inscription à la formation</h3>

  <form id="contactForm">

    <input type="text" name="name" placeholder="Nom complet" required onfocus="parler('Entrez votre nom complet ici')">

    <input type="email" name="email" placeholder="Email" required onfocus="parler('Entrez votre adresse email valide')">

    <input type="text" name="country" placeholder="Pays" required onfocus="parler('Entrez votre pays de résidence')">

    <input type="text" name="whatsapp" placeholder="Numéro WhatsApp" required onfocus="parler('Entrez votre numéro WhatsApp pour être contacté')">

    <input type="text" id="formation" name="formation" readonly>

    <textarea name="message" placeholder="Message (optionnel)" onfocus="parler('Vous pouvez laisser un message si vous voulez')"></textarea>

    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="Nouvelle inscription formation">

    <button type="submit" id="submitBtn" onclick="parler('Cliquez pour finaliser votre inscription')">
      S'inscrire
    </button>

  </form>

  <p id="status"></p>

</section>

<!-- Bouton couper le son -->
<button class="mute-btn" onclick="stopVoix()">🔇</button>

<script>
let voixActive = true;

function parler(message) {
  if (!voixActive) return;

  const voix = new SpeechSynthesisUtterance(message);
  voix.lang = "fr-FR";
  voix.rate = 0.95;
  voix.pitch = 1;
  speechSynthesis.speak(voix);
}

function demarrerGuide() {
  parler("Bienvenue sur la page d'inscription.");

  setTimeout(() => {
    parler("Remplissez le formulaire pour continuer.");
  }, 3000);

  setTimeout(() => {
    parler("Commencez par entrer votre nom complet.");
  }, 6000);
}

function stopVoix() {
  voixActive = false;
  speechSynthesis.cancel();
}

const params = new URLSearchParams(window.location.search);
const formationValue = params.get("formation") || "Non précisée";
document.getElementById("formation").value = formationValue;


document.getElementById("contactForm").addEventListener("submit", function(e) {
  e.preventDefault();

  parler("Inscription en cours. Veuillez patienter.");

  const form = e.target;
  const submitBtn = document.getElementById("submitBtn");
  const status = document.getElementById("status");

  const name = form.name.value;
  const email = form.email.value;
  const formation = form.formation.value;

  submitBtn.disabled = true;
  status.style.color = "#0f172a";
  status.textContent = "⏳ Envoi en cours...";

  fetch("https://formsubmit.co/ajax/gaelnobime5@gmail.com", {
    method: "POST",
    body: new FormData(form)
  })
  .then(res => res.json())
  .then(() => {

    localStorage.setItem('inscritName', name);
    localStorage.setItem('inscritEmail', email);
    localStorage.setItem('inscritFormation', formation);

    status.style.color = "green";
    status.textContent = "✅ Inscription réussie !";

    parler("Inscription réussie. Vous allez être redirigé.");

    setTimeout(() => {
      window.location.href = "merci.html";
    }, 1500);

  })
  .catch(() => {
    status.style.color = "red";
    status.textContent = "❌ Erreur, réessaie.";
    parler("Une erreur est survenue. Veuillez réessayer.");
    submitBtn.disabled = false;
  });

});
</script>

<footer>
  <p>© 2026 – Formation Digital % Gaël Nobime & Odilon Laly ®</p>
</footer>

</body>
</html>
