<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formations Digitales</title>

<style>
body { font-family: Arial; margin:0; background:#f5f6fa; }

header {
  background:#2f80ed;
  color:white;
  padding:15px;
  text-align:center;
}

section {
  padding:40px 20px;
  max-width:1000px;
  margin:auto;
}

h2 { text-align:center; color:#2f80ed; }

.formations {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}

.formation {
  background:white;
  padding:20px;
  border-radius:8px;
  width:250px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  text-align:center;
}

.histoire { 
  background: gainsboro;
  padding:20px;
  border-radius:8px;
  width:215px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  text-align:center;
}

button {
  padding:10px;
  background:#27ae60;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.mute-btn {
  position:fixed;
  bottom:20px;
  right:20px;
  background:red;
  color:white;
  border:none;
  padding:10px;
  border-radius:5px;
}

footer {
  background: #222;
  color: #fff;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>🚀 Centre de Formation Digitale</h1>
</header>

<section>
  <h2>Choisissez votre formation</h2>

  <div class="formations">

    <div class="formation">
      <h3>IA</h3>
      <p class="histoire">Création des photos pro, Affiches pub, Chanson, vidéos automatisées</p>
      <a href="inscription.html?formation=IA">
        <button onclick="parler('Vous avez choisi la formation intelligence artificielle.')">
          Choisir
        </button>
      </a>
    </div>

    <div class="formation">
      <h3>Marketing Digital</h3>
      <p>Gagner de l’argent en ligne</p>
      <a href="inscription.html?formation=MARKETING">
        <button onclick="parler('Vous avez choisi la formation marketing digital.')">
          Choisir
        </button>
      </a>
    </div>

  </div>
</section>

<button class="mute-btn" onclick="stopVoix()">🔇 Couper le son</button>

<footer>
  <p>© 2026 – Formation Digital % Gaël Nobime / Odilon Laly ® </p>
</footer>

<script>
let voixActive = true;
let dejaJoue = false;

// 🎤 parler
function parler(message) {
  if (!voixActive) return;

  const voix = new SpeechSynthesisUtterance(message);
  voix.lang = "fr-FR";
  voix.rate = 0.95;

  speechSynthesis.cancel();
  speechSynthesis.speak(voix);
}

// 🚀 guide démarre au premier contact utilisateur
function demarrerGuide() {
  if (dejaJoue) return;
  dejaJoue = true;

  parler("Bienvenue dans le monde du digital.");

  setTimeout(() => {
    parler("Veuillez choisir une formation pour continuer.");
  }, 3000);
}

// 👇 IMPORTANT : déclenchement réel (mobile + PC)
document.addEventListener("click", demarrerGuide, { once: true });
document.addEventListener("touchstart", demarrerGuide, { once: true });

// 🔇 stop
function stopVoix() {
  voixActive = false;
  speechSynthesis.cancel();
}
</script>

</body>
</html>
