<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci pour votre inscription</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container {
  background:#1e293b;
  padding:30px 20px;
  border-radius:10px;
  text-align:center;
  width:90%;
  max-width:500px;
}

h1 { color:#4ade80; }

button {
  margin-top:20px;
  padding:16px;
  width:100%;
  font-size:18px;
  background: royalblue;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover {
  background:darkred;
}

.mute-btn {
  position:fixed;
  bottom:20px;
  right:20px;
  background:red;
  color:white;
  border:none;
  padding:10px;
  border-radius:5px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎉 Inscription réussie !</h1>

<p id="messagePerso">Chargement...</p>

<div id="detailsInscription"></div>

<h3>👉 Cliquez sur payer maintenant pour confirmer</h3>

<a href="https://nyrrnajz.mychariow.shop/prd_4j6na2">
  <button onclick="parler('Vous allez maintenant confirmer votre accès')">
    💳 Payer maintenant
  </button>
</a>

</div>

<button class="mute-btn" onclick="stopVoix()">🔇</button>

<script>
let voixActive = true;
let dejaJoue = false;

// 🎤 parler
function parler(message) {
  if (!voixActive) return;

  const voix = new SpeechSynthesisUtterance(message);
  voix.lang = "fr-FR";
  voix.rate = 0.95;

  speechSynthesis.cancel();
  speechSynthesis.speak(voix);
}

// 🚀 déclenchement automatique après interaction
function lancerVoix() {
  if (dejaJoue) return;
  dejaJoue = true;

  parler("Félicitations, votre inscription est bien reçue.");

  setTimeout(() => {
    parler("Pour confirmer votre accès à la formation, cliquez maintenant sur payer.");
  }, 3000);

  setTimeout(() => {
    parler("Attention, votre place est limitée. Merci.");
  }, 7000);
}

// 👆 fonctionne sur mobile + PC
document.addEventListener("click", lancerVoix, { once: true });
document.addEventListener("touchstart", lancerVoix, { once: true });

// 🔇 couper
function stopVoix() {
  voixActive = false;
  speechSynthesis.cancel();
}

// 📌 récupérer données
const name = localStorage.getItem('inscritName');
const email = localStorage.getItem('inscritEmail');
const formation = localStorage.getItem('inscritFormation');

if(name){
  document.getElementById("messagePerso").innerHTML =
    "Merci <strong>" + name + "</strong>, votre inscription est confirmée !";

  document.getElementById("detailsInscription").innerHTML =
    "<p>Email: " + email + "</p><p>Formation: " + formation + "</p>";

  localStorage.clear();
}
</script>

</body>
</html>
